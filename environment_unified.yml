# Unified PETS environment (eye_repo)
#
# Single user-facing conda env for notebooks, preprocessing, Block Annotator,
# Preprocessing GUI, and Event Explorer.
#
# GUI/video stack uses **pip** OpenCV + PyQt6 (not conda opencv) so Windows DLLs
# stay compatible in one process. Linux can use the same file; for conda PyQt on
# Linux without pip wheels, see environment_linux.yml.
#
# Setup:
#   conda env create -f environment.yml
#   conda activate eye_repo
#   pip install -e .
#
# Migrating from eye_annotator:
#   conda env create -f environment.yml
#   conda activate eye_repo
#   pip install -e .

name: eye_repo
channels:
  - conda-forge
dependencies:
  - python>=3.10,<3.11
  - pip
  - setuptools
  - wheel
  - jupyter
  - ipykernel
  - pip:
      # --- scientific / preprocessing ---
      - numpy==2.2.6
      - scipy==1.15.3
      - pandas==2.3.3
      - matplotlib==3.10.9
      - h5py==3.16.0
      - lxml==6.1.1
      - tqdm==4.67.3
      - bokeh==3.9.0
      - ellipse==0.6.0
      - open-ephys-python-tools==1.0.1
      # --- GUI + video (all annotation apps) ---
      - PyQt6==6.6.0
      - PyQt6-Qt6==6.6.0
      - PyQt6_sip==13.11.1
      - pyqtgraph==0.14.0
      - opencv-python-headless==4.13.0.92
      - PyYAML==6.0.3
      # --- dev / test ---
      - pytest>=8.0
      - pytest-qt>=4.0
