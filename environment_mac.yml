# PETS conda environment — macOS (Apple Silicon and Intel).
#
# GUI/video uses pip PyQt6 + opencv-python-headless (same approach as Windows)
# to avoid Linux-only conda packages (libegl, xcb-util-cursor, etc.).
#
# Setup:
#   conda env create -f environment_mac.yml
#   conda activate eye_repo_mac
#
# Or: bash scripts/setup_eye_repo_mac.sh

name: eye_repo_mac
channels:
  - conda-forge
dependencies:
  - python>=3.10,<3.11
  - pip
  - setuptools
  - wheel
  - jupyter
  - ipykernel
  # conda-forge binaries. The PyPI wheels of these versions ship an
  # _spropack extension whose Mach-O __thread_bss section dyld rejects
  # on current macOS, so scipy.sparse.linalg never imports.
  - numpy=2.2.6
  - scipy=1.15.2
  - pip:
      - pandas==2.3.3
      - openpyxl==3.1.5
      - matplotlib==3.10.9
      - h5py==3.16.0
      - lxml==6.1.1
      - tqdm==4.67.3
      - bokeh==3.9.0
      - ellipse==0.6.0
      - open-ephys-python-tools==1.0.1
      - PyQt6==6.6.0
      - PyQt6-Qt6==6.6.0
      - PyQt6_sip==13.11.1
      - pyqtgraph==0.14.0
      - opencv-python-headless==4.13.0.92
      - PyYAML==6.0.3
      - -e .
