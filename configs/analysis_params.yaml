# Default analysis / figure parameters (paper notebook call sites).
# Edit without changing code. Units documented inline.

saccade:
  # Angular speed threshold in degrees per video frame (~50 deg/s at 60 Hz).
  speed_threshold_deg_per_frame: 0.8
  directional_delta_threshold_deg: 90.0
  min_subsaccade_samples: 2
  min_net_disp_deg: 0.5
  speed_profile: true

binocular:
  # Pair L/R onsets when |dt| < this (ms). Notebook OE threshold 680 ~= 34 ms at 20 kHz.
  sync_diff_ms: 34.0

main_sequence:
  amp_col: net_angular_disp
  bin_width_deg: 5.0
  min_amp_deg: 0.5
  max_amp_pct: 99.5
  min_events_per_bin: 15
  frame_rate_fps: 60.0
  t_window_ms: [-100.0, 100.0]
  dt_ms: 2.0
  bandwidth_ms: 10.0
  min_events_per_bin_traces: 30
  per_animal_max_bins: 8
  # Paper Fig 2c/2d panel animal. Must match an animal in the current registry
  # (or set null / omit to plot every animal present). A total miss warns and
  # falls back to all present animals.
  plot_animals: [PV_106]
  # Fig 2e class scatters: one animal, same xlim/ylim as the multi-animal means panel.
  scatter_animal: PV_106
  # Pooled all-animal Gaussian-KDE likelihood (Fig 2h: Scott bandwidth, 200 bins, turbo).
  density_nbins: 200
  density_cmap: turbo
  density_figsize: [3.8, 3.2]
  bin_cmap: viridis
  # Kernel path (main_sequence_analysis.ipynb paper call site).
  smoothing: true
  subsample_peak: false
  normalize_velocity_to_peak: false
  normalize_position_to_amp: false
  normalize_final_curve: false
  align_to: peak
  position_calc: mov_axis
  # Paper Fig 2c unit. Event peak_velocity is stored as deg/frame; exporters convert.
  velocity_unit: deg/sec
  use_fixed_dt: false
  framerate_hz: null
  eye_filter: null

figure_2f:
  iqr_multiplier: 60.0
  bins: 60
  macro_range: [0.0, 0.5]
  micro_range: [0.0, 0.1]
  macro_tick_list: [0.0, 0.25, 0.5]
  micro_tick_list: [0.0, 0.05, 0.1]
  # Head-stationary coupling: asymmetry should emerge without an explicit
  # monocular filter. PV_62 excluded (head-movement labels unreliable); PV_57
  # excluded (no lizMov.mat on paper blocks → head_movement NaN).
  event_mode: all  # all | monocular | binocular
  require_head_stationary: true
  exclude_animals: [PV_62, PV_57]
  pairing_mode: synced_ms  # synced_ms | legacy_contra_table (notebook reproduction)
  contra_event_window_ms: 100.0
  pair_merge_ms: 60.0
  contra_sample_ms: 51.0
  # Peak-speed pairing: contra_window (legacy paper 2f) | event_span (strict on/off span)
  sample_mode: contra_window
  also_export_s3: false  # S3 is a separate still/moving exporter


figure_2g:
  amp_bins: 40
  amp_max_deg: 25.0

figure_2h:
  nbins: 200
  global_min: -10.0
  global_max: 10.0

figure_2i:
  num_bins: 36
  baseline_prob: 0.005

figure_3e:
  num_bins: 40
  x_range: [1.4, 2.35]
  outlier_percentiles: [0.001, 99.999]
  animals: [PV_62]
  figsize: [2.2, 1.5]

figure_3f:
  num_bins: 15
  x_range: [-3.0, 3.0]
  outlier_percentiles: [0.1, 99.9]
  exclude_animals: [PV_57]
  figsize: [2.2, 1.7]

figure_3a_3c:
  # Single-block vignettes (paper default block: PV_126_block_007).
  block_key: null  # null -> prefer PV_126_block_007, else first block in EventTables
  figure_2b:
    start_s: 0.0
    end_s: 8.0
    traces: [center_x, center_y]
    figsize: [2.3, 1.8]
    std_multiplier: 3
    with_state: false
  figure_3a:
    start_s: 210.0
    end_s: 240.0
    traces: [center_x, center_y]
    figsize: [2.3, 1.8]
    std_multiplier: 3
    with_state: false
  figure_3b:
    start_s: 310.0
    end_s: 340.0
    traces: [center_x, center_y]
    figsize: [2.3, 1.8]
    std_multiplier: 3
    with_state: false
  figure_3c:
    start_s: 200.0
    end_s: 415.0
    traces: [center_x, center_y, pupil_diameter, saccade_frequency]
    figsize: [4.7, 3.7]
    std_multiplier: 3.5
    with_state: true
    head_merge_ms: 20
    plot_state_y: 20
    x_zero_origin: true
    pupil_ticks: [1.5, 2.0, 2.5]

figure_3d:
  # Shared across the log/linear panels below.
  font_family: Arial
  color_template: okabeito
  combined_label: "All (combined)"
  frame_ms_fallback: 16.67  # used only when tables.blocks has no ms_axis traces
  log:
    figure_size: [2.5, 2.2]
    num_bins: 20
    high_ms: 20000.0
    pair_threshold_ms: 60.0
    min_isi_ms: null  # null -> 0.75 * frame_ms
    first_bin_factor: 0.5  # first real edge = first_bin_factor * frame_ms
    add_leading_zero_bin: false
    log_exponent: 1.0
    xlim: [100.0, 20000.0]
    ylim: [0.0, 0.15]
    linewidth: 1.5
    combined_linewidth: 2.0
    combined_color: k
    combined_linestyle: "-"
    xlabel: "ISI [ms]"
    ylabel: Probability
  linear:
    figure_size: [2.0, 1.5]
    num_bins: 1176
    low_ms: 10.0
    high_ms: 20000.0
    pair_threshold_ms: 60.0
    min_isi_ms: null  # null -> 0.75 * frame_ms
    add_leading_zero_bin: false
    xlim: [10.0, 300.0]
    xlim_policy: slice  # slice | conditional | fold
    ylim: null
    linewidth: 1.2
    combined_linewidth: 2.0
    combined_color: k
    combined_linestyle: "-"
    xlabel: "ISI [ms]"
    ylabel: "Probability (per linear bin)"
