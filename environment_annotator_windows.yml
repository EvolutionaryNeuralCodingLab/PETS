# DEPRECATED — use environment.yml (eye_repo) instead.
# Kept for one release cycle so existing scripts keep working.
#
# You must copy the full PETS repo to the destination PC (this file alone is not enough —
# the annotator code lives in this repository and is not on PyPI).
#
# From the PETS repo root on the destination PC:
#   conda env create -f environment_annotator_windows.yml
#   conda activate eye_annotator
#   pip install -e . --no-deps
#   python -m eye_tracking_system_tools.annotation.block_annotator
#
# Or run:  powershell -ExecutionPolicy Bypass -File scripts\setup_annotator_windows.ps1
#
# Do NOT use conda env export files (e.g. eye_annotator.yml) on other machines —
# they pin eye-tracking-system-tools from PyPI, which does not exist.
#
# For day-to-day development on a machine that already has the repo, the minimal
# environment_annotator.yml (-e ".[annotator]") is enough.

name: eye_annotator
channels:
  - conda-forge
dependencies:
  - python>=3.10,<3.11
  - pip
  - setuptools
  - wheel
  - pip:
      # --- scientific / preprocessing (BlockSync, block_sync_core) ---
      - numpy==2.2.6
      - scipy==1.15.3
      - pandas==2.3.3
      - matplotlib==3.10.9
      - h5py==3.16.0
      - lxml==6.1.1
      - tqdm==4.67.3
      - bokeh==3.9.0
      - ellipse==0.6.0
      - open-ephys-python-tools==1.0.1
      # --- GUI + video (annotator) ---
      - PyQt6==6.6.0
      - PyQt6-Qt6==6.6.0
      - PyQt6_sip==13.11.1
      - pyqtgraph==0.14.0
      - opencv-python==4.13.0.92
      - opencv-python-headless==4.13.0.92
      - PyYAML==6.0.3
      # --- dev / test (needed for the Preprocessing GUI pytest suite) ---
      - pytest>=8.0
      - pytest-qt>=4.0
      # eye-tracking-system-tools: install from repo after env create:
      #   pip install -e . --no-deps
