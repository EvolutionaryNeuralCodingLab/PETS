# Block Annotator — Linux/Ubuntu without sudo (user-space conda only).
#
# Uses conda-forge for PyQt, OpenCV, and X11/Qt runtime libraries (no apt).
# On Windows, keep using environment_annotator.yml (pip PyQt6 avoids DLL clashes).
#
# From repo root:
#   conda env create -f environment_annotator_linux.yml
#   conda activate eye_annotator
#
# You still need a display (local desktop, X11 forwarding, or xvfb-run — see SETUP_INSTRUCTIONS.md).

name: eye_annotator
channels:
  - conda-forge
dependencies:
  - python>=3.10,<3.11
  - pip

  # GUI: PyQt6 module + Qt6 + X11/xcb libs via qtbase dependencies
  - pyqt>=6.6,<6.8
  - pyqtgraph>=0.13

  # Video (conda OpenCV is OK on Linux; Windows annotator env uses pip-only instead)
  - opencv>=4.10

  # Extra X11/GUI runtime (often pulled by pyqt; explicit helps minimal/base images)
  - xcb-util-cursor
  - libgl
  - libegl
  - fontconfig
  - dbus

  # BlockSync / preprocessing used by the annotator
  - numpy>=2.0,<2.3
  - scipy>=1.10,<1.16
  - pandas>=2.3
  - matplotlib>=3.10
  - h5py>=3.15
  - lxml>=6.0
  - tqdm>=4.67
  - bokeh>=3.8
  - pyyaml>=6.0

  # Dev/test (needed for the Preprocessing GUI pytest suite)
  - pytest>=8.0
  - pytest-qt>=4.0

  - pip:
      - ellipse>=0.6.0
      - open-ephys-python-tools
      - -e . --no-deps
